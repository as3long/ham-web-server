<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>修改密码 - 留言板</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="wrap narrow">
  <header class="head">
    <h1>修改密码</h1>
    <p class="sub">当前账号：{{user}}</p>
  </header>

  {{if error}}
  <div class="flash err">{{error}}</div>
  {{/if}}

  <section class="form-card">
    <form method="post" action="/board/password">
      <div class="row">
        <label>旧密码</label>
        <input name="oldPassword" type="password" maxlength="64" required autofocus>
      </div>
      <div class="row">
        <label>新密码</label>
        <input name="newPassword" type="password" maxlength="64" required placeholder="至少 6 位，且与旧密码不同">
      </div>
      <div class="row">
        <label>确认新密码</label>
        <input name="confirm" type="password" maxlength="64" required>
      </div>
      <button type="submit">保存新密码</button>
    </form>
  </section>

  <footer class="foot"><a href="/board/">« 返回留言板</a></footer>
</main>
</body>
</html>
