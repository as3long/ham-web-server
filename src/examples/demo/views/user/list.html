<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>用户列表 - Ham</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="card">
  <h1>用户列表 <small>你已访问本页 {{viewCount}} 次</small></h1>
  {{if users.length === 0}}
  <p class="empty">还没有用户，<a href="/user/add">添加一个</a>。</p>
  {{else}}
  <table>
    <tr><th>ID</th><th>姓名</th><th>邮箱</th><th>注册时间</th></tr>
    {{each users}}
    <tr>
      <td>{{$value.id}}</td>
      <td>{{$value.name}}</td>
      <td>{{$value.email}}</td>
      <td>{{$imports.formatDateTime($value.createdAt)}}</td>
    </tr>
    {{/each}}
  </table>
  {{/if}}
  <p><a href="/user/add">+ 添加用户</a> | <a href="/">返回首页</a></p>
</main>
</body>
</html>
