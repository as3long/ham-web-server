<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>购物车 - 阿福小馆</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/static/dinner.css">
</head>
<body>
<main class="wrap">
  <header class="head">
    <h1>购物车</h1>
    <nav class="tabs">
      <a href="/dinner/">继续点菜</a>
      <a class="active" href="/dinner/cart">购物车</a>
    </nav>
  </header>

  {{if error}}
  <div class="flash err">{{error}}</div>
  {{/if}}

  <section class="card">
    {{if cart.length === 0}}
    <p class="empty">购物车是空的，先去<a href="/dinner/">点几道菜</a>吧～</p>
    {{else}}
    <table class="cart-table">
      <tr><th>菜品</th><th>单价</th><th>数量</th><th>小计</th><th>操作</th></tr>
      {{each cart}}
      <tr>
        <td><b>{{$value.name}}</b></td>
        <td>¥{{$value.priceYuan}}</td>
        <td>
          <form class="qty-form" method="post" action="/dinner/cartUpdate">
            <input type="hidden" name="dishId" value="{{$value.id}}">
            <input class="qty" name="qty" value="{{$value.quantity}}" inputmode="numeric">
            <button class="mini-btn" type="submit">更新</button>
          </form>
        </td>
        <td>¥{{$value.subtotalYuan}}</td>
        <td>
          <form method="post" action="/dinner/cartUpdate">
            <input type="hidden" name="dishId" value="{{$value.id}}">
            <input type="hidden" name="qty" value="0">
            <button class="mini-btn danger" type="submit">移除</button>
          </form>
        </td>
      </tr>
      {{/each}}
    </table>
    <p class="total">合计：<b>¥{{totalYuan}}</b></p>
    <form method="post" action="/dinner/cartClear">
      <button class="mini-btn danger" type="submit">清空购物车</button>
    </form>

    <h3 class="sec-title">提交订单</h3>
    <form method="post" action="/dinner/orderSubmit" class="submit-form">
      <div class="row">
        <label>称呼</label>
        <input name="customer" maxlength="20" placeholder="如：张同学" required>
      </div>
      <div class="row">
        <label>桌号</label>
        <input name="tableNo" maxlength="10" placeholder="如：8">
      </div>
      <button class="primary" type="submit">提交订单</button>
      <span class="tip">提交后生成取餐号，可随时凭号查单</span>
    </form>
    {{/if}}
  </section>

  <footer class="foot"><a href="/dinner/">« 回到菜单</a></footer>
</main>
</body>
</html>
